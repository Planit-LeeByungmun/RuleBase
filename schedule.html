<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스케줄 관리 시스템</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', -apple-system, sans-serif; background: #f0f2f5; color: #1a1a2e; min-height: 100vh; }

  /* Header */
  .header { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; padding: 20px 32px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .header h1 { font-size: 22px; font-weight: 700; }
  .header .today-btn { background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.4); color: #fff; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: background .2s; }
  .header .today-btn:hover { background: rgba(255,255,255,.35); }

  /* Layout */
  .container { display: flex; gap: 24px; padding: 24px 32px; max-width: 1400px; margin: 0 auto; }
  .left-panel { flex: 1; min-width: 0; }
  .right-panel { width: 360px; flex-shrink: 0; }

  /* Calendar Nav */
  .cal-nav { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
  .cal-nav button { background: #fff; border: 1px solid #ddd; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: background .2s; }
  .cal-nav button:hover { background: #667eea; color: #fff; border-color: #667eea; }
  .cal-nav .month-label { font-size: 20px; font-weight: 700; min-width: 160px; text-align: center; cursor: pointer; position: relative; user-select: none; }
  .cal-nav .month-label:hover { color: #667eea; }

  /* Month Picker Dropdown */
  .month-picker { display: none; position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: #fff; border: 1px solid #ddd; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.15); z-index: 200; padding: 16px; width: 280px; }
  .month-picker.open { display: block; }
  .mp-year-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .mp-year-row button { background: #f0f0f0; border: none; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
  .mp-year-row button:hover { background: #667eea; color: #fff; }
  .mp-year-val { font-size: 16px; font-weight: 700; }
  .mp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .mp-month { padding: 8px 0; text-align: center; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all .15s; }
  .mp-month:hover { background: #eef2ff; color: #667eea; }
  .mp-month.selected { background: #667eea; color: #fff; font-weight: 700; }
  .mp-month.today { outline: 2px solid #667eea; outline-offset: -2px; }

  /* Calendar */
  .calendar { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow: hidden; }
  .cal-header { display: grid; grid-template-columns: repeat(7, 1fr); background: #f8f9fa; }
  .cal-header div { padding: 12px 0; text-align: center; font-size: 13px; font-weight: 600; color: #666; }
  .cal-header div:first-child { color: #e74c3c; }
  .cal-header div:last-child { color: #3498db; }
  .cal-body { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal-cell { min-height: 100px; border: 1px solid #f0f0f0; padding: 6px; cursor: pointer; transition: background .15s; position: relative; }
  .cal-cell:hover { background: #f8f9ff; }
  .cal-cell.other-month { background: #fafafa; }
  .cal-cell.other-month .day-num { color: #ccc; }
  .cal-cell.today { background: #eef2ff; }
  .cal-cell.selected { outline: 2px solid #667eea; outline-offset: -2px; }
  .day-num { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .cal-cell:nth-child(7n+1) .day-num { color: #e74c3c; }
  .cal-cell:nth-child(7n) .day-num { color: #3498db; }
  .cal-event { font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; cursor: pointer; }
  .cal-event.ev-color-0 { background: #667eea; }
  .cal-event.ev-color-1 { background: #e74c3c; }
  .cal-event.ev-color-2 { background: #27ae60; }
  .cal-event.ev-color-3 { background: #f39c12; }
  .cal-event.ev-color-4 { background: #9b59b6; }
  .cal-event.ev-color-5 { background: #e67e22; }
  .cal-event.ev-color-6 { background: #1abc9c; }
  .cal-event.ev-color-7 { background: #e84393; }
  /* Event Tooltip */
  .cal-event-wrap { position: relative; }
  .cal-event-wrap:hover .cal-tooltip { display: block; }
  .cal-tooltip { display: none; position: absolute; top: 50%; left: calc(100% + 8px); transform: translateY(-50%); background: #2d2d3f; color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 12px; line-height: 1.5; white-space: normal; z-index: 100; box-shadow: 0 4px 12px rgba(0,0,0,.25); pointer-events: none; min-width: 180px; max-width: 280px; width: max-content; word-break: break-word; }
  .cal-tooltip::after { content: ''; position: absolute; top: 50%; right: 100%; transform: translateY(-50%); border: 5px solid transparent; border-right-color: #2d2d3f; }
  .cal-tooltip .tt-title { font-weight: 700; font-size: 13px; margin-bottom: 4px; word-break: break-word; }
  .cal-tooltip .tt-time { color: #a8b0ff; }
  .cal-tooltip .tt-priority { color: #ffd36e; }
  .cal-tooltip .tt-memo { color: #ccc; max-width: 200px; white-space: normal; margin-top: 2px; }

  /* Right Panel */
  .panel-card { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 20px; margin-bottom: 16px; }
  .panel-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .selected-date { font-size: 14px; color: #667eea; font-weight: 600; margin-bottom: 12px; }

  /* Form */
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #555; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; transition: border-color .2s; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,.1); }

  /* Time Row - Korean Calendar Style */
  .time-row { background: #f8f9fa; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; overflow: visible; position: relative; }
  .time-row-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .time-row-header .clock-label { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #333; }
  .time-row-header .clock-label svg { width: 18px; height: 18px; color: #667eea; }
  /* Toggle Switch */
  .toggle-switch { position: relative; width: 44px; height: 24px; cursor: pointer; }
  .toggle-switch input { display: none; }
  .toggle-track { width: 44px; height: 24px; background: #ccc; border-radius: 12px; transition: background .2s; }
  .toggle-switch input:checked + .toggle-track { background: #667eea; }
  .toggle-knob { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; background: #fff; border-radius: 50%; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .toggle-switch input:checked ~ .toggle-knob { transform: translateX(20px); }
  /* Date Row */
  .time-date-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #e8e8e8; }
  .time-date-row svg { width: 16px; height: 16px; color: #888; flex-shrink: 0; }
  .time-date-display { font-size: 15px; font-weight: 500; color: #333; }
  /* Time selectors inline */
  .time-inline { display: flex; align-items: center; gap: 10px; overflow: visible; }
  .time-inline .time-sep { font-size: 13px; color: #888; font-weight: 600; }
  .time-trigger { position: relative; }
  .time-trigger-btn { display: flex; align-items: center; gap: 5px; padding: 6px 12px; background: #fff; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; color: #333; transition: all .2s; user-select: none; white-space: nowrap; }
  .time-trigger-btn:hover { border-color: #667eea; }
  .time-trigger-btn.active { border-color: #667eea; box-shadow: 0 0 0 2px rgba(102,126,234,.15); }
  .time-trigger-btn .arrow { font-size: 10px; color: #667eea; margin-left: 2px; }
  .time-trigger-btn.disabled { opacity: .4; pointer-events: none; }
  /* Dropdown */
  .tp-dropdown { display: none; position: absolute; top: calc(100% + 4px); left: 0; background: #fff; border: 1px solid #ddd; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.12); z-index: 999; padding: 10px; width: 210px; }
  .tp-dropdown.open { display: block; }
  .tp-cols { display: flex; gap: 6px; }
  .tp-col { flex: 1; text-align: center; }
  .tp-col-label { font-size: 11px; font-weight: 600; color: #888; margin-bottom: 4px; }
  .tp-scroll { max-height: 160px; overflow-y: auto; border: 1px solid #eee; border-radius: 6px; }
  .tp-scroll::-webkit-scrollbar { width: 4px; }
  .tp-scroll::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }
  .tp-opt { padding: 5px 0; font-size: 13px; cursor: pointer; border-radius: 4px; transition: background .1s; }
  .tp-opt:hover { background: #f0f2ff; }
  .tp-opt.selected { background: #667eea; color: #fff; font-weight: 600; }
  .tp-actions { display: flex; gap: 6px; margin-top: 8px; }
  .tp-actions button { flex: 1; padding: 6px 0; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .tp-actions .tp-clear { background: #f0f0f0; color: #666; }
  .tp-actions .tp-clear:hover { background: #e0e0e0; }
  .tp-actions .tp-ok { background: #667eea; color: #fff; }
  .tp-actions .tp-ok:hover { background: #5a6fd6; }
  .form-group textarea { resize: vertical; min-height: 60px; }
  .form-row { display: flex; gap: 8px; }
  .form-row .form-group { flex: 1; }
  .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s; }
  .btn-primary { background: #667eea; color: #fff; width: 100%; }
  .btn-primary:hover { background: #5a6fd6; }
  .btn-danger { background: #fee; color: #e74c3c; padding: 6px 12px; font-size: 12px; }
  .btn-danger:hover { background: #e74c3c; color: #fff; }
  .btn-edit { background: #eef2ff; color: #667eea; padding: 6px 12px; font-size: 12px; }
  .btn-edit:hover { background: #667eea; color: #fff; }
  .btn-cancel { background: #f0f0f0; color: #666; width: 100%; }
  .btn-cancel:hover { background: #e0e0e0; }

  /* Schedule List */
  .schedule-list { list-style: none; }
  .schedule-item { display: flex; align-items: flex-start; gap: 10px; padding: 12px; border-radius: 8px; margin-bottom: 8px; background: #f8f9fa; transition: background .15s; }
  .schedule-item:hover { background: #eef2ff; }
  .schedule-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
  .schedule-dot.dot-color-0 { background: #667eea; }
  .schedule-dot.dot-color-1 { background: #e74c3c; }
  .schedule-dot.dot-color-2 { background: #27ae60; }
  .schedule-dot.dot-color-3 { background: #f39c12; }
  .schedule-dot.dot-color-4 { background: #9b59b6; }
  .schedule-dot.dot-color-5 { background: #e67e22; }
  .schedule-dot.dot-color-6 { background: #1abc9c; }
  .schedule-dot.dot-color-7 { background: #e84393; }
  .schedule-info { flex: 1; min-width: 0; }
  .schedule-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .schedule-title.done { color: #aaa; }
  .schedule-time { font-size: 12px; color: #888; }
  .schedule-desc { font-size: 12px; color: #888; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .schedule-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .schedule-check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #ccc; cursor: pointer; display: flex; align-items: center; justify-content: center; background: #fff; flex-shrink: 0; margin-top: 3px; transition: all .2s; font-size: 12px; }
  .schedule-check.checked { background: #27ae60; border-color: #27ae60; color: #fff; }
  .empty-msg { text-align: center; color: #aaa; padding: 20px; font-size: 14px; }

  /* Pagination */
  .pagination { display: flex; justify-content: center; gap: 4px; margin-top: 12px; }
  .page-btn { width: 30px; height: 30px; border: 1px solid #ddd; border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; font-weight: 600; color: #555; display: flex; align-items: center; justify-content: center; transition: all .2s; }
  .page-btn:hover { background: #eef2ff; border-color: #667eea; color: #667eea; }
  .page-btn.active { background: #667eea; color: #fff; border-color: #667eea; }


  /* Search */
  .search-box { position: relative; margin-bottom: 12px; }
  .search-box input { width: 100%; padding: 10px 12px 10px 36px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
  .search-box input:focus { outline: none; border-color: #667eea; }
  .search-box::before { content: '\1F50D'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 14px; }

  /* Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.active { display: flex; }
  .modal { background: #fff; border-radius: 16px; padding: 28px; width: 420px; max-width: 90vw; max-height: 90vh; overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,.2); }
  .modal h3 { font-size: 18px; margin-bottom: 20px; }
  .modal .btn-row { display: flex; gap: 8px; margin-top: 16px; }
  .modal .btn-row .btn { flex: 1; }

  /* View Toggle */
  .view-toggle { display: flex; gap: 4px; }
  .view-btn { background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.4); color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: background .2s; }
  .view-btn:hover { background: rgba(255,255,255,.35); }
  .view-btn.active { background: rgba(255,255,255,.45); }

  /* Yearly View */
  .yearly-view { display: none; }
  .yearly-view.visible { display: block; }
  .monthly-view.hidden { display: none; }
  .year-nav { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
  .year-nav button { background: #fff; border: 1px solid #ddd; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: background .2s; }
  .year-nav button:hover { background: #667eea; color: #fff; border-color: #667eea; }
  .year-nav .year-label { font-size: 20px; font-weight: 700; min-width: 100px; text-align: center; }
  .year-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .year-month { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 16px; cursor: pointer; transition: all .2s; }
  .year-month:hover { box-shadow: 0 4px 12px rgba(102,126,234,.2); transform: translateY(-2px); }
  .year-month.current { outline: 2px solid #667eea; }
  .year-month-name { font-size: 16px; font-weight: 700; margin-bottom: 10px; color: #333; }
  .year-month-stats { display: flex; flex-direction: column; gap: 4px; }
  .year-stat-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #666; }
  .year-stat-row .count { font-weight: 700; }
  .year-stat-row .count.has { color: #667eea; }
  .year-mini-bar { height: 6px; background: #eee; border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .year-mini-bar .fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #667eea, #764ba2); transition: width .3s; }
  .year-month-events { margin-top: 8px; }
  .year-event-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 3px; }
  .year-event-preview { font-size: 11px; color: #888; margin-top: 4px; line-height: 1.5; }
  .year-event-preview div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  @media (max-width: 900px) {
    .container { flex-direction: column; padding: 16px; }
    .right-panel { width: 100%; }
    .cal-cell { min-height: 70px; }
    .year-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="header">
  <h1>&#128197; 스케줄 관리 시스템</h1>
  <div class="view-toggle">
    <button class="view-btn active" id="btnMonthly" onclick="switchView('monthly')">월</button>
    <button class="view-btn" id="btnYearly" onclick="switchView('yearly')">년</button>
    <button class="today-btn" onclick="goToday()" style="margin-left:8px;">오늘</button>
  </div>
</div>

<div class="container">
  <div class="left-panel">
    <!-- Monthly View -->
    <div class="monthly-view" id="monthlyView">
      <div class="cal-nav">
        <button onclick="changeMonth(-1)">&#9664;</button>
        <div class="month-label" id="monthLabel" onclick="toggleMonthPicker(event)">
          <div class="month-picker" id="monthPicker"></div>
        </div>
        <button onclick="changeMonth(1)">&#9654;</button>
      </div>
      <div class="calendar">
        <div class="cal-header">
          <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
        </div>
        <div class="cal-body" id="calBody"></div>
      </div>
    </div>
    <!-- Yearly View -->
    <div class="yearly-view" id="yearlyView">
      <div class="year-nav">
        <button onclick="changeYear(-1)">&#9664;</button>
        <div class="year-label" id="yearLabel"></div>
        <button onclick="changeYear(1)">&#9654;</button>
      </div>
      <div class="year-grid" id="yearGrid"></div>
    </div>
  </div>

  <div class="right-panel">
    <div class="panel-card">
      <h3>&#10133; 새 스케줄</h3>
      <div class="selected-date" id="selectedDateLabel"></div>
      <div class="form-group">
        <label>제목</label>
        <input type="text" id="inputTitle" placeholder="스케줄 제목">
      </div>
      <div class="time-row" id="timeRowInput">
        <div class="time-row-header">
          <div class="clock-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            하루 종일
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="allDayInput" onchange="toggleAllDay('input')">
            <div class="toggle-track"></div>
            <div class="toggle-knob"></div>
          </label>
        </div>
        <div class="time-date-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span class="time-date-display" id="inputDateDisplay"></span>
        </div>
        <div class="time-inline" id="timeInlineInput">
          <div class="time-trigger" id="tpInputStart"></div>
          <span class="time-sep">종료</span>
          <div class="time-trigger" id="tpInputEnd"></div>
        </div>
      </div>
      <div class="form-group">
        <label>우선순위</label>
        <select id="inputPriority">
          <option value="" disabled selected>선택하세요</option>
          <option value="low">낮음</option>
          <option value="medium">보통</option>
          <option value="high">높음</option>
        </select>
      </div>
      <div class="form-group">
        <label>메모</label>
        <textarea id="inputDesc" placeholder="메모 (선택사항)"></textarea>
      </div>
      <button class="btn btn-primary" onclick="addSchedule()">추가</button>
    </div>

    <div class="panel-card">
      <h3>&#128203; 스케줄 목록</h3>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="검색..." oninput="renderDaySchedules()">
      </div>
      <ul class="schedule-list" id="scheduleList"></ul>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>&#9999;&#65039; 스케줄 수정</h3>
    <input type="hidden" id="editId">
    <div class="form-group">
      <label>제목</label>
      <input type="text" id="editTitle">
    </div>
    <div class="time-row" id="timeRowEdit">
      <div class="time-row-header">
        <div class="clock-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          하루 종일
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="allDayEdit" onchange="toggleAllDay('edit')">
          <div class="toggle-track"></div>
          <div class="toggle-knob"></div>
        </label>
      </div>
      <div class="time-date-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span class="time-date-display" id="editDateDisplay"></span>
        <input type="date" id="editDate" style="margin-left:auto; padding:4px 8px; border:1px solid #ddd; border-radius:6px; font-size:13px;">
      </div>
      <div class="time-inline" id="timeInlineEdit">
        <div class="time-trigger" id="tpEditStart"></div>
        <span class="time-sep">종료</span>
        <div class="time-trigger" id="tpEditEnd"></div>
      </div>
    </div>
    <div class="form-group">
      <label>우선순위</label>
      <select id="editPriority">
        <option value="" disabled selected>선택하세요</option>
        <option value="low">낮음</option>
        <option value="medium">보통</option>
        <option value="high">높음</option>
      </select>
    </div>
    <div class="form-group">
      <label>메모</label>
      <textarea id="editDesc"></textarea>
    </div>
    <div class="btn-row">
      <button class="btn btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" onclick="saveEdit()">저장</button>
    </div>
  </div>
</div>

<script>
  let currentYear, currentMonth, selectedDate;
  let schedules = JSON.parse(localStorage.getItem('schedules') || '[]');

  /* ── AM/PM Time Picker (Korean Calendar Style) ── */

  function formatKoreanTime(hour, minute) {
    if (hour === null || minute === null) return '시간 선택';
    const h = parseInt(hour);
    const ampm = h < 12 ? '오전' : '오후';
    const h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
    return `${ampm} ${h12}:${minute}`;
  }

  function createTimePicker(containerId, placeholder, onChange) {
    const container = document.getElementById(containerId);
    const state = { hour: null, minute: null, open: false, pickedHour: false, pickedMinute: false };

    const btn = document.createElement('div');
    btn.className = 'time-trigger-btn';
    btn.innerHTML = `<span class="tp-label">${placeholder}</span><span class="arrow">&#9660;</span>`;

    const dropdown = document.createElement('div');
    dropdown.className = 'tp-dropdown';

    // AM/PM column + hour (1-12) + minutes (5-min)
    const ampmHtml = ['오전', '오후'].map(v => `<div class="tp-opt" data-ampm="${v}">${v}</div>`).join('');
    const hoursHtml = Array.from({length: 12}, (_, i) => {
      const h = i === 0 ? 12 : i;
      return `<div class="tp-opt" data-h12="${h}">${h}</div>`;
    }).join('');
    const minsHtml = Array.from({length: 60}, (_, i) => {
      const m = String(i).padStart(2, '0');
      return `<div class="tp-opt" data-minute="${m}">${m}</div>`;
    }).join('');

    dropdown.innerHTML = `
      <div class="tp-cols">
        <div class="tp-col"><div class="tp-col-label">오전/오후</div><div class="tp-scroll tp-ampm">${ampmHtml}</div></div>
        <div class="tp-col"><div class="tp-col-label">시</div><div class="tp-scroll tp-hours">${hoursHtml}</div></div>
        <div class="tp-col"><div class="tp-col-label">분</div><div class="tp-scroll tp-mins">${minsHtml}</div></div>
      </div>
      <div class="tp-actions">
        <button class="tp-clear" type="button">초기화</button>
        <button class="tp-ok" type="button">확인</button>
      </div>
    `;

    container.appendChild(btn);
    container.appendChild(dropdown);

    // Internal state helpers
    function getAmpm() {
      if (state.hour === null) return '오전';
      return parseInt(state.hour) < 12 ? '오전' : '오후';
    }
    function getH12() {
      if (state.hour === null) return null;
      const h = parseInt(state.hour);
      if (h === 0) return 12;
      return h > 12 ? h - 12 : h;
    }

    function updateDisplay() {
      const label = btn.querySelector('.tp-label');
      label.textContent = formatKoreanTime(state.hour, state.minute);
    }

    function highlight() {
      const ampm = getAmpm();
      const h12 = getH12();
      dropdown.querySelectorAll('.tp-ampm .tp-opt').forEach(el => {
        el.classList.toggle('selected', el.dataset.ampm === ampm);
      });
      dropdown.querySelectorAll('.tp-hours .tp-opt').forEach(el => {
        el.classList.toggle('selected', h12 !== null && parseInt(el.dataset.h12) === h12);
      });
      dropdown.querySelectorAll('.tp-mins .tp-opt').forEach(el => {
        el.classList.toggle('selected', el.dataset.minute === state.minute);
      });
    }

    function scrollToSel() {
      dropdown.querySelectorAll('.tp-opt.selected').forEach(el => {
        el.scrollIntoView({ block: 'center', behavior: 'instant' });
      });
    }

    function openDrop() {
      document.querySelectorAll('.tp-dropdown.open').forEach(d => d.classList.remove('open'));
      document.querySelectorAll('.time-trigger-btn.active').forEach(d => d.classList.remove('active'));
      dropdown.classList.add('open');
      btn.classList.add('active');
      state.open = true;
      state.pickedHour = false;
      state.pickedMinute = false;
      highlight();
      setTimeout(scrollToSel, 0);
    }

    function closeDrop() {
      dropdown.classList.remove('open');
      btn.classList.remove('active');
      state.open = false;
    }

    // Stop propagation on the whole container so document click doesn't close it
    container.addEventListener('click', (e) => {
      e.stopPropagation();
    });

    btn.addEventListener('click', () => {
      if (state.open) closeDrop(); else openDrop();
    });

    dropdown.addEventListener('click', (e) => {
      const opt = e.target.closest('.tp-opt');
      if (opt) {
        if (opt.dataset.ampm !== undefined) {
          const curH12 = getH12() || 10;
          const isAM = opt.dataset.ampm === '오전';
          let h24 = isAM ? (curH12 === 12 ? 0 : curH12) : (curH12 === 12 ? 12 : curH12 + 12);
          state.hour = String(h24).padStart(2, '0');
          if (state.minute === null) state.minute = '00';
          state.pickedHour = true;
        }
        if (opt.dataset.h12 !== undefined) {
          const h12 = parseInt(opt.dataset.h12);
          const isAM = getAmpm() === '오전';
          let h24 = isAM ? (h12 === 12 ? 0 : h12) : (h12 === 12 ? 12 : h12 + 12);
          state.hour = String(h24).padStart(2, '0');
          if (state.minute === null) state.minute = '00';
          state.pickedHour = true;
        }
        if (opt.dataset.minute !== undefined) {
          state.minute = opt.dataset.minute;
          if (state.hour === null) state.hour = '09';
          state.pickedMinute = true;
        }
        highlight();
        updateDisplay();
        if (state.pickedHour && state.pickedMinute) {
          if (onChange) onChange(state.hour + ':' + state.minute);
          setTimeout(closeDrop, 150);
        }
      }
      if (e.target.classList.contains('tp-clear')) {
        state.hour = null; state.minute = null;
        highlight(); updateDisplay(); closeDrop();
      }
      if (e.target.classList.contains('tp-ok')) {
        closeDrop();
      }
    });

    return {
      getValue() {
        if (state.hour !== null && state.minute !== null) return `${state.hour}:${state.minute}`;
        return '';
      },
      setValue(val) {
        if (val && val.includes(':')) {
          const [h, m] = val.split(':');
          state.hour = h.padStart(2, '0');
          state.minute = m.padStart(2, '0');
        } else {
          state.hour = null; state.minute = null;
        }
        updateDisplay();
      },
      close: closeDrop,
      setDisabled(disabled) {
        btn.classList.toggle('disabled', disabled);
        if (disabled) closeDrop();
      },
    };
  }

  // Close all dropdowns on outside click
  document.addEventListener('click', () => {
    document.querySelectorAll('.tp-dropdown.open').forEach(d => d.classList.remove('open'));
    document.querySelectorAll('.time-trigger-btn.active').forEach(d => d.classList.remove('active'));
  });

  // Add 1 hour to a time string "HH:MM" → "HH:MM"
  function addOneHour(timeStr) {
    const [h, m] = timeStr.split(':').map(Number);
    const newH = (h + 1) % 24;
    return String(newH).padStart(2, '0') + ':' + String(m).padStart(2, '0');
  }

  // Initialize time pickers (start pickers auto-set end to +1 hour)
  const tpInputEnd = createTimePicker('tpInputEnd', '종료 시간');
  const tpInputStart = createTimePicker('tpInputStart', '시작 시간', function(val) {
    if (!tpInputEnd.getValue()) tpInputEnd.setValue(addOneHour(val));
  });
  const tpEditEnd = createTimePicker('tpEditEnd', '종료 시간');
  const tpEditStart = createTimePicker('tpEditStart', '시작 시간', function(val) {
    tpEditEnd.setValue(addOneHour(val));
  });

  // All-day toggle
  function toggleAllDay(context) {
    const isInput = context === 'input';
    const checked = document.getElementById(isInput ? 'allDayInput' : 'allDayEdit').checked;
    const startPicker = isInput ? tpInputStart : tpEditStart;
    const endPicker = isInput ? tpInputEnd : tpEditEnd;
    startPicker.setDisabled(checked);
    endPicker.setDisabled(checked);
    if (checked) {
      startPicker.setValue('');
      endPicker.setValue('');
    }
  }

  // Update date display helpers
  function updateInputDateDisplay() {
    const parts = selectedDate.split('-');
    document.getElementById('inputDateDisplay').textContent = `${parts[0]}. ${parseInt(parts[1])}. ${parseInt(parts[2])}.`;
  }
  function updateEditDateDisplay(dateStr) {
    if (!dateStr) return;
    const parts = dateStr.split('-');
    document.getElementById('editDateDisplay').textContent = `${parts[0]}. ${parseInt(parts[1])}. ${parseInt(parts[2])}.`;
  }

  /* ── Core App ── */
  function save() {
    localStorage.setItem('schedules', JSON.stringify(schedules));
  }

  function dateKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function getSchedulesForDate(key) {
    return schedules.filter(s => s.date === key).sort((a,b) => (a.start||'').localeCompare(b.start||''));
  }

  let currentView = 'monthly';
  let viewYear;

  function init() {
    const now = new Date();
    currentYear = now.getFullYear();
    currentMonth = now.getMonth();
    viewYear = currentYear;
    selectedDate = dateKey(now);
    renderCalendar();
    renderDaySchedules();
  }

  function goToday() {
    const now = new Date();
    currentYear = now.getFullYear();
    currentMonth = now.getMonth();
    viewYear = currentYear;
    selectedDate = dateKey(now);
    if (currentView === 'yearly') {
      renderYearlyView();
    } else {
      renderCalendar();
      renderDaySchedules();
    }
  }

  function switchView(view) {
    currentView = view;
    document.getElementById('btnMonthly').classList.toggle('active', view === 'monthly');
    document.getElementById('btnYearly').classList.toggle('active', view === 'yearly');
    document.getElementById('monthlyView').classList.toggle('hidden', view === 'yearly');
    document.getElementById('yearlyView').classList.toggle('visible', view === 'yearly');
    if (view === 'yearly') {
      viewYear = currentYear;
      renderYearlyView();
    }
  }

  function changeMonth(delta) {
    currentMonth += delta;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    renderCalendar();
  }

  /* ── Month Picker ── */
  let mpYear = null;
  let mpOpen = false;

  function toggleMonthPicker(e) {
    e.stopPropagation();
    const picker = document.getElementById('monthPicker');
    if (mpOpen) {
      picker.classList.remove('open');
      mpOpen = false;
    } else {
      mpYear = currentYear;
      renderMonthPicker();
      picker.classList.add('open');
      mpOpen = true;
    }
  }

  function renderMonthPicker() {
    const picker = document.getElementById('monthPicker');
    const now = new Date();
    const todayY = now.getFullYear();
    const todayM = now.getMonth();
    const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

    picker.innerHTML = `
      <div class="mp-year-row">
        <button onclick="mpChangeYear(-1, event)">&#9664;</button>
        <span class="mp-year-val">${mpYear}년</span>
        <button onclick="mpChangeYear(1, event)">&#9654;</button>
      </div>
      <div class="mp-grid">
        ${months.map((name, i) => {
          const sel = mpYear === currentYear && i === currentMonth ? 'selected' : '';
          const today = mpYear === todayY && i === todayM ? 'today' : '';
          return `<div class="mp-month ${sel} ${today}" onclick="selectMonth(${mpYear}, ${i}, event)">${name}</div>`;
        }).join('')}
      </div>
    `;
  }

  function mpChangeYear(delta, e) {
    e.stopPropagation();
    mpYear += delta;
    renderMonthPicker();
  }

  function selectMonth(year, month, e) {
    e.stopPropagation();
    currentYear = year;
    currentMonth = month;
    document.getElementById('monthPicker').classList.remove('open');
    mpOpen = false;
    renderCalendar();
    renderDaySchedules();
  }

  // Close month picker on outside click
  document.addEventListener('click', () => {
    if (mpOpen) {
      document.getElementById('monthPicker').classList.remove('open');
      mpOpen = false;
    }
  });

  function changeYear(delta) {
    viewYear += delta;
    renderYearlyView();
  }

  function getSchedulesForMonth(year, month) {
    const prefix = `${year}-${String(month + 1).padStart(2, '0')}`;
    return schedules.filter(s => s.date && s.date.startsWith(prefix));
  }

  function renderYearlyView() {
    document.getElementById('yearLabel').textContent = `${viewYear}년`;
    const grid = document.getElementById('yearGrid');
    const now = new Date();
    const todayYear = now.getFullYear();
    const todayMonth = now.getMonth();
    const monthNames = ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'];
    const colors = ['#667eea', '#e74c3c', '#27ae60', '#f39c12', '#9b59b6', '#e67e22', '#1abc9c', '#e84393'];

    let maxCount = 0;
    const monthData = [];
    for (let m = 0; m < 12; m++) {
      const events = getSchedulesForMonth(viewYear, m);
      const done = events.filter(e => e.done).length;
      if (events.length > maxCount) maxCount = events.length;
      monthData.push({ events, done });
    }

    grid.innerHTML = monthData.map((data, m) => {
      const total = data.events.length;
      const done = data.done;
      const isCurrent = viewYear === todayYear && m === todayMonth;
      const barWidth = maxCount > 0 ? Math.round((total / maxCount) * 100) : 0;

      // Preview top 3 events
      const preview = data.events.slice(0, 3).map((ev, i) =>
        `<div><span class="year-event-dot" style="background:${colors[i % 8]}"></span>${esc(ev.title)}</div>`
      ).join('');

      return `
        <div class="year-month ${isCurrent ? 'current' : ''}" onclick="goToMonth(${m})">
          <div class="year-month-name">${monthNames[m]}</div>
          <div class="year-month-stats">
            <div class="year-stat-row"><span>전체</span><span class="count ${total > 0 ? 'has' : ''}">${total}</span></div>
            <div class="year-stat-row"><span>완료</span><span class="count" style="color:#27ae60">${done}</span></div>
            <div class="year-stat-row"><span>미완료</span><span class="count" style="color:#f39c12">${total - done}</span></div>
          </div>
          <div class="year-mini-bar"><div class="fill" style="width:${barWidth}%"></div></div>
          ${preview ? `<div class="year-event-preview">${preview}</div>` : ''}
        </div>`;
    }).join('');
  }

  function goToMonth(month) {
    currentYear = viewYear;
    currentMonth = month;
    selectedDate = `${currentYear}-${String(month + 1).padStart(2, '0')}-01`;
    switchView('monthly');
    renderCalendar();
    renderDaySchedules();
  }

  function renderCalendar() {
    const label = document.getElementById('monthLabel');
    const picker = document.getElementById('monthPicker');
    label.innerHTML = '';
    label.appendChild(document.createTextNode(`${currentYear}년 ${currentMonth + 1}월 ▾`));
    label.appendChild(picker);

    const body = document.getElementById('calBody');
    body.innerHTML = '';

    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    const prevDays = new Date(currentYear, currentMonth, 0).getDate();
    const todayKey = dateKey(new Date());

    const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;

    for (let i = 0; i < totalCells; i++) {
      const cell = document.createElement('div');
      cell.className = 'cal-cell';
      let day, key;

      if (i < firstDay) {
        day = prevDays - firstDay + i + 1;
        const m = currentMonth === 0 ? 12 : currentMonth;
        const y = currentMonth === 0 ? currentYear - 1 : currentYear;
        key = `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        cell.classList.add('other-month');
      } else if (i >= firstDay + daysInMonth) {
        day = i - firstDay - daysInMonth + 1;
        const m = currentMonth + 2 > 12 ? 1 : currentMonth + 2;
        const y = currentMonth + 2 > 12 ? currentYear + 1 : currentYear;
        key = `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        cell.classList.add('other-month');
      } else {
        day = i - firstDay + 1;
        key = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      }

      if (key === todayKey) cell.classList.add('today');
      if (key === selectedDate) cell.classList.add('selected');

      cell.innerHTML = `<div class="day-num">${day}</div>`;

      const events = getSchedulesForDate(key);
      const priorityLabel = { high: '높음', medium: '보통', low: '낮음' };
      events.forEach((ev, idx) => {
        const wrap = document.createElement('div');
        wrap.className = 'cal-event-wrap';
        const tag = document.createElement('div');
        tag.className = `cal-event ev-color-${idx % 8}`;
        tag.textContent = ev.title;
        tag.addEventListener('click', (e) => { e.stopPropagation(); openEdit(ev.id); });
        const timeText = ev.allDay ? '하루 종일' : ((ev.start ? formatKoreanTime(...ev.start.split(':')) : '') + (ev.start && ev.end ? ' ~ ' : '') + (ev.end ? formatKoreanTime(...ev.end.split(':')) : ''));
        const tooltip = document.createElement('div');
        tooltip.className = 'cal-tooltip';
        tooltip.innerHTML = `<div class="tt-title">${esc(ev.title)}</div>`
          + (timeText ? `<div class="tt-time">${timeText}</div>` : '')
          + `<div class="tt-priority">우선순위: ${priorityLabel[ev.priority] || '보통'}</div>`
          + (ev.desc ? `<div class="tt-memo">${esc(ev.desc)}</div>` : '')
          + (ev.done ? `<div style="color:#7bed9f;margin-top:2px;">&#10003; 완료</div>` : '');
        wrap.appendChild(tag);
        wrap.appendChild(tooltip);
        cell.appendChild(wrap);
      });

      cell.onclick = () => { selectedDate = key; currentPage = 1; renderCalendar(); renderDaySchedules(); };
      body.appendChild(cell);
    }

  }

  let currentPage = 1;
  const PAGE_SIZE = 3;

  function renderDaySchedules(page) {
    if (page !== undefined) currentPage = page;
    const list = document.getElementById('scheduleList');
    const pag = document.getElementById('pagination');
    const label = document.getElementById('selectedDateLabel');
    const search = document.getElementById('searchInput').value.toLowerCase();
    const parts = selectedDate.split('-');
    label.textContent = `${parts[0]}년 ${parseInt(parts[1])}월 ${parseInt(parts[2])}일`;
    updateInputDateDisplay();

    let events = getSchedulesForDate(selectedDate);
    if (search) events = events.filter(e => e.title.toLowerCase().includes(search) || (e.desc||'').toLowerCase().includes(search));

    if (!events.length) {
      list.innerHTML = '<div class="empty-msg">스케줄이 없습니다</div>';
      pag.innerHTML = '';
      return;
    }

    const totalPages = Math.ceil(events.length / PAGE_SIZE);
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;

    const start = (currentPage - 1) * PAGE_SIZE;
    const pageEvents = events.slice(start, start + PAGE_SIZE);

    const priorityLabel = { high: '높음', medium: '보통', low: '낮음' };
    list.innerHTML = pageEvents.map((ev, i) => {
      const idx = start + i;
      return `
      <li class="schedule-item">
        <div class="schedule-dot dot-color-${idx % 8}"></div>
        <div class="schedule-check ${ev.done ? 'checked' : ''}" onclick="toggleDone('${ev.id}')">
          ${ev.done ? '&#10003;' : ''}
        </div>
        <div class="schedule-info">
          <div class="schedule-title ${ev.done ? 'done' : ''}">${esc(ev.title)}</div>
          <div class="schedule-time">${ev.allDay ? '하루 종일' : ((ev.start ? formatKoreanTime(...ev.start.split(':')) : '') + (ev.start && ev.end ? ' ~ ' : '') + (ev.end ? formatKoreanTime(...ev.end.split(':')) : ''))} &middot; ${priorityLabel[ev.priority]}</div>
          ${ev.desc ? `<div class="schedule-desc">${esc(ev.desc)}</div>` : ''}
        </div>
        <div class="schedule-actions">
          <button class="btn btn-edit" onclick="openEdit('${ev.id}')">수정</button>
          <button class="btn btn-danger" onclick="deleteSchedule('${ev.id}')">삭제</button>
        </div>
      </li>`;
    }).join('');

    // Pagination
    if (totalPages <= 1) {
      pag.innerHTML = '';
      return;
    }
    pag.innerHTML = Array.from({length: totalPages}, (_, i) => {
      const p = i + 1;
      return `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="renderDaySchedules(${p})">${p}</button>`;
    }).join('');
  }

  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function addSchedule() {
    const title = document.getElementById('inputTitle').value.trim();
    if (!title) { alert('제목을 입력해 주세요.'); return; }

    const allDay = document.getElementById('allDayInput').checked;
    schedules.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      date: selectedDate,
      title,
      start: allDay ? '' : tpInputStart.getValue(),
      end: allDay ? '' : tpInputEnd.getValue(),
      allDay,
      priority: document.getElementById('inputPriority').value || 'medium',
      desc: document.getElementById('inputDesc').value.trim(),
      done: false,
    });
    save();

    document.getElementById('inputTitle').value = '';
    document.getElementById('allDayInput').checked = false;
    toggleAllDay('input');
    tpInputStart.setValue('');
    tpInputEnd.setValue('');
    document.getElementById('inputPriority').selectedIndex = 0;
    document.getElementById('inputDesc').value = '';

    renderCalendar();
    renderDaySchedules();
  }

  function deleteSchedule(id) {
    if (!confirm('삭제하시겠습니까?')) return;
    schedules = schedules.filter(s => s.id !== id);
    save();
    renderCalendar();
    renderDaySchedules();
  }

  function toggleDone(id) {
    const s = schedules.find(s => s.id === id);
    if (s) { s.done = !s.done; save(); renderCalendar(); renderDaySchedules(); }
  }

  function openEdit(id) {
    const s = schedules.find(s => s.id === id);
    if (!s) return;
    document.getElementById('editId').value = id;
    document.getElementById('editTitle').value = s.title;
    document.getElementById('allDayEdit').checked = !!s.allDay;
    toggleAllDay('edit');
    if (!s.allDay) {
      tpEditStart.setValue(s.start || '');
      tpEditEnd.setValue(s.end || '');
    }
    document.getElementById('editDate').value = s.date;
    updateEditDateDisplay(s.date);
    document.getElementById('editPriority').value = s.priority;
    document.getElementById('editDesc').value = s.desc || '';
    document.getElementById('editModal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('editModal').classList.remove('active');
    tpEditStart.close();
    tpEditEnd.close();
  }

  function saveEdit() {
    const id = document.getElementById('editId').value;
    const s = schedules.find(s => s.id === id);
    if (!s) return;
    const title = document.getElementById('editTitle').value.trim();
    if (!title) { alert('제목을 입력해 주세요.'); return; }
    const allDayE = document.getElementById('allDayEdit').checked;
    s.title = title;
    s.allDay = allDayE;
    s.start = allDayE ? '' : tpEditStart.getValue();
    s.end = allDayE ? '' : tpEditEnd.getValue();
    s.date = document.getElementById('editDate').value;
    s.priority = document.getElementById('editPriority').value || 'medium';
    s.desc = document.getElementById('editDesc').value.trim();
    save();
    closeModal();

    // Reset edit form
    tpEditStart.setValue('');
    tpEditEnd.setValue('');
    document.getElementById('editPriority').selectedIndex = 0;

    // Reset input form
    tpInputStart.setValue('');
    tpInputEnd.setValue('');
    document.getElementById('inputPriority').selectedIndex = 0;

    renderCalendar();
    renderDaySchedules();
  }

  document.getElementById('editModal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  document.getElementById('editDate').addEventListener('change', function() {
    updateEditDateDisplay(this.value);
  });

  init();
</script>
</body>
</html>
