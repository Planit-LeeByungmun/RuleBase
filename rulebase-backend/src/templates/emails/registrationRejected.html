<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>회원가입 반려</title></head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; color: #333;">
  <div style="background: #dc2626; color: white; padding: 20px; border-radius: 8px 8px 0 0;">
    <h1 style="margin: 0; font-size: 24px;">RuleBase</h1>
  </div>
  <div style="background: white; border: 1px solid #e5e7eb; border-top: none; padding: 30px; border-radius: 0 0 8px 8px;">
    <h2 style="color: #dc2626;">회원가입 신청이 반려되었습니다</h2>
    <p>안녕하세요, <strong>{{displayName}}</strong>님.</p>
    <p>죄송하지만 RuleBase 회원가입 신청이 반려되었습니다.</p>
    <p>문의사항이 있으시면 관리자(<a href="mailto:{{contactEmail}}">{{contactEmail}}</a>)에게 연락해 주세요.</p>
  </div>
</body>
</html>
