<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>회원가입 승인</title></head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; color: #333;">
  <div style="background: #2563eb; color: white; padding: 20px; border-radius: 8px 8px 0 0;">
    <h1 style="margin: 0; font-size: 24px;">RuleBaseEx</h1>
  </div>
  <div style="background: white; border: 1px solid #e5e7eb; border-top: none; padding: 30px; border-radius: 0 0 8px 8px;">
    <h2 style="color: #16a34a;">회원가입이 승인되었습니다!</h2>
    <p>안녕하세요, <strong>{{displayName}}</strong>님!</p>
    <p>RuleBaseEx 회원가입 신청이 승인되었습니다. 이제 로그인하여 서비스를 이용할 수 있습니다.</p>
    <div style="text-align: center; margin: 30px 0;">
      <a href="{{loginUrl}}" style="background: #2563eb; color: white; padding: 12px 30px; border-radius: 6px; text-decoration: none; font-weight: bold;">로그인하기</a>
    </div>
  </div>
</body>
</html>
